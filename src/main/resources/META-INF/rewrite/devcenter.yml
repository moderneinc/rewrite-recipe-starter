# A custom DevCenter, adapted from io.moderne.devcenter.DevCenterStarter in rewrite-devcenter. See
# https://docs.moderne.io/administrator-documentation/moderne-platform/how-to-guides/recipe-based-devcenter/
---
type: specs.openrewrite.org/v1beta/recipe
name: com.yourorg.DevCenter
displayName: Your organization's DevCenter
description: >-
  A custom DevCenter tracking Spring Boot, Java, and Angular upgrades alongside OWASP top ten issues.
recipeList:
  - io.moderne.devcenter.LibraryUpgrade:
      cardName: Move to Spring Boot 4.1
      groupIdPattern: org.springframework.boot
      artifactIdPattern: '*'
      version: 4.1.0
      upgradeRecipe: io.moderne.java.spring.boot4.UpgradeSpringBoot_4_1
  - io.moderne.devcenter.JavaVersionUpgrade:
      majorVersion: 25
      upgradeRecipe: org.openrewrite.java.migrate.UpgradeToJava25
  - io.moderne.devcenter.AngularVersionUpgrade:
      majorVersion: 22
      upgradeRecipe: org.openrewrite.angular.UpgradeToAngular22
  - io.moderne.devcenter.SecurityStarter
  - io.moderne.devcenter.FindOrganizationStatistics
  - io.moderne.devcenter.FindActiveCommitters
